# 연구 주제. UI 문자열은 _data/i18n.yml, 논문 목록은 _data/publications.json.
# 그림은 PI의 기존 연구에서 가져온 예시이며 출처를 반드시 표기한다.
en:
  - id: foundation-models
    title: "Medical Foundation Models"
    summary: >-
      Pre-training on large unlabelled collections of images, biosignals, and clinical text, so that a downstream task can start from a handful of labels.
    figure: "/assets/img/research/cibm.png"
    figure_credit: "Example from our EEG–fNIRS foundation model (Computers in Biology and Medicine, 2025), © the respective publisher."
    keywords:
      - "Self-supervised learning"
      - "Representation learning"
      - "Few-shot transfer"

  - id: multimodal
    title: "Multimodal and Cross-Modality Learning"
    summary: >-
      Fusing image, signal, and text together, and translating one modality into another when acquiring it is expensive or impossible.
    figure: "/assets/img/research/spine.png"
    figure_credit: "Example from our PET/MR synthesis work (The Spine Journal, 2024), © the respective publisher."
    keywords:
      - "Multimodal fusion"
      - "Cross-modality synthesis"
      - "Vision–language"

  - id: generative
    title: "Generative Models for Medical Data"
    summary: >-
      Diffusion models and GANs with explicit control over anatomy and clinical condition — for synthesis, disease progression, and privacy-preserving sharing.
    figure: "/assets/img/research/pattern_recognition.png"
    figure_credit: "Example from our conditional GAN work on Alzheimer's progression (Pattern Recognition, 2023), © the respective publisher."
    keywords:
      - "Diffusion models"
      - "GANs"
      - "Controllable synthesis"

  - id: label-efficient
    title: "Label-Efficient and Robust Learning"
    summary: >-
      Learning under weak, noisy, or shifting supervision, so that accuracy survives a new site, a new scanner, or a new patient.
    figure: "/assets/img/research/tnsre.png"
    figure_credit: "Example from our EEG-based pain assessment work (IEEE TNSRE, 2026), © the respective publisher."
    keywords:
      - "Semi-supervised learning"
      - "Noisy labels"
      - "Domain shift"


ko:
  - id: foundation-models
    title: "의료 파운데이션 모델"
    summary: >-
      영상·생체신호·임상텍스트로 이루어진 대규모 비레이블 데이터로 사전학습해, 적은 레이블만으로 downstream 과제에 옮겨 쓸 수 있는 표현을 학습합니다.
    figure: "/assets/img/research/cibm.png"
    figure_credit: "예시: 본 연구실의 EEG–fNIRS 파운데이션 모델 (Computers in Biology and Medicine, 2025), © 해당 출판사."
    keywords:
      - "자기지도학습"
      - "표현 학습"
      - "Few-shot 전이"

  - id: multimodal
    title: "멀티모달·모달리티 간 학습"
    summary: >-
      영상·신호·텍스트를 함께 융합하는 방법과, 얻기 어렵거나 촬영 비용이 큰 모달리티를 다른 모달리티에서 생성해내는 방법을 연구합니다.
    figure: "/assets/img/research/spine.png"
    figure_credit: "예시: 본 연구실의 PET/MR 합성 연구 (The Spine Journal, 2024), © 해당 출판사."
    keywords:
      - "멀티모달 융합"
      - "모달리티 간 합성"
      - "Vision–language"

  - id: generative
    title: "의료 데이터 생성 모델"
    summary: >-
      해부학적 구조와 임상 조건을 명시적으로 통제하는 diffusion·GAN으로 데이터 합성, 질환 진행 모델링, 프라이버시 보존 공유를 다룹니다.
    figure: "/assets/img/research/pattern_recognition.png"
    figure_credit: "예시: 본 연구실의 알츠하이머 진행 조건부 GAN 연구 (Pattern Recognition, 2023), © 해당 출판사."
    keywords:
      - "Diffusion 모델"
      - "GAN"
      - "제어 가능한 합성"

  - id: label-efficient
    title: "레이블 효율·강건 학습"
    summary: >-
      약하거나 잡음이 섞이거나 분포가 바뀌는 감독 신호 아래에서도, 다른 기관·장비·환자로 옮겨갔을 때 성능이 유지되는 학습을 연구합니다.
    figure: "/assets/img/research/tnsre.png"
    figure_credit: "예시: 본 연구실의 뇌파 기반 통증 평가 연구 (IEEE TNSRE, 2026), © 해당 출판사."
    keywords:
      - "준지도학습"
      - "잡음 레이블"
      - "도메인 시프트"

