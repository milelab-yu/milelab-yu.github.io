# 연구 주제. UI 문자열은 _data/i18n.yml, 논문 목록은 _data/publications.json.
# 그림은 발표 논문에서 가져온 예시이며 출처를 반드시 표기한다.
en:
  - id: bci
    title: "Brain–Computer Interface"
    figure: "/assets/img/research/tnsre.png"
    figure_credit: "Example from our EEG-based pain assessment work (IEEE TNSRE, 2026), © the respective publisher."
    keywords:
      - "EEG and fNIRS"
      - "Neural decoding"
      - "Non-invasive BCI"

  - id: generative
    title: "Image Generation"
    figure: "/assets/img/research/pattern_recognition.png"
    figure_credit: "Example from our conditional GAN work on Alzheimer's progression (Pattern Recognition, 2023), © the respective publisher."
    keywords:
      - "Diffusion models"
      - "GANs"
      - "Controllable synthesis"

  - id: multimodal
    title: "Multimodal and Cross-Modality Learning"
    figure: "/assets/img/research/spine.png"
    figure_credit: "Example from our PET/MR synthesis work (The Spine Journal, 2024), © the respective publisher."
    keywords:
      - "Multimodal fusion"
      - "Cross-modality synthesis"
      - "Vision–language"

  - id: foundation-models
    title: "Medical Foundation Models"
    figure: "/assets/img/research/cibm.png"
    figure_credit: "Example from our EEG–fNIRS foundation model (Computers in Biology and Medicine, 2025), © the respective publisher."
    keywords:
      - "Self-supervised learning"
      - "Representation learning"
      - "Few-shot transfer"

