en:
  pi:
    name: "Euijin Jung"
    name_local: "정의진"
    role_line: "Assistant Professor, School of Computer Science and Engineering, Yeungnam University"
    email: "euijin@yu.ac.kr"
    photo: "/assets/img/people/prof_pic.jpg"
    photo_alt: "Euijin Jung"
    bio:
      - >-
        I work on machine learning across medical images, biosignals, and clinical
        text, with an interest in representations that still hold when labels are
        scarce or the site and the subject change. I received my Ph.D. from DGIST in
        2023, stayed on as a postdoctoral researcher in the Division of Intelligent
        Robot, and joined the School of Computer Science and Engineering at Yeungnam
        University in 2026.
    career:
      - when: "2026 –"
        what: "Assistant Professor, School of Computer Science and Engineering, Yeungnam University"
      - when: "2023 – 2026"
        what: "Postdoctoral Researcher, Division of Intelligent Robot, DGIST"
      - when: "2023"
        what: "Ph.D., DGIST"
    links:
      scholar: "https://scholar.google.com/citations?user=-rAfX9kAAAAJ"
  members: []
  alumni: []

